{% extends "base.html" %}
{% block content %}
<h1>Transactions</h1>

<form method="get" action="/transactions" class="inline-form" style="margin:1rem 0">
    <label>
        Account:
        <select name="account_id" onchange="this.form.submit()">
            <option value="">All accounts</option>
            {% for account in accounts %}
            <option value="{{ account.id }}" {% if selected_account_id == account.id %}selected{% endif %}>
                {{ account.name }}
            </option>
            {% endfor %}
        </select>
    </label>
    <label>
        Category:
        <select name="category_id" onchange="this.form.submit()">
            <option value="">All categories</option>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if selected_category_id == category.id %}selected{% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}
        </select>
    </label>
    <label>
        <input type="checkbox" name="uncategorized_only" value="true" {% if uncategorized_only %}checked{% endif %}
               onchange="this.form.submit()">
        Uncategorized only
    </label>
    <noscript><button type="submit">Apply</button></noscript>
</form>

<div class="table-wrap">
<table class="compact striped">
    <thead><tr>
        <th>Posted</th>
        <th>Account</th>
        <th>Payee</th>
        <th>Amount</th>
        <th>Category</th>
        <th></th>
    </tr></thead>
    <tbody>
    {% for transaction in transactions %}
        {% include "partials/transaction_row.html" %}
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
