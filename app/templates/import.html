{% extends "base.html" %}
{% block content %}
<h1>Import CSV</h1>
<p>Expects columns: <code>Date</code> (YYYY-MM-DD), <code>Description</code>, <code>Amount</code>.</p>

{% if error %}<p class="flash error">{{ error }}</p>{% endif %}
{% if result is not none %}<p class="flash ok">Imported {{ result }} new transaction(s).</p>{% endif %}

<article>
    <form method="post" action="/import" enctype="multipart/form-data" class="inline-form">
        <select name="account_id" required>
            {% for account in accounts %}
            <option value="{{ account.id }}">{{ account.name }}</option>
            {% endfor %}
        </select>
        <input type="file" name="file" accept=".csv" required>
        <button type="submit">Import</button>
    </form>
</article>
{% endblock %}
