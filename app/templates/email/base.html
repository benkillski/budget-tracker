<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title | default("Budget Tracker") }}</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f2937;background:#f8fafc;margin:0;padding:1.5rem 0;">
    <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;padding:1.5rem 2rem;">
        <h1 style="color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:0.5rem;margin-top:0;font-size:1.5rem;">
            {% block header %}Budget Tracker{% endblock %}
        </h1>
        <div style="margin:1rem 0;line-height:1.5;">
            {% block body %}{% endblock %}
        </div>
        <hr style="margin:2rem 0 1rem;border:none;border-top:1px solid #e2e8f0;">
        <p style="color:#94a3b8;font-size:0.8125rem;margin:0;">
            Sent by Budget Tracker. You're receiving this because the budget-tracker service
            on your LXC has an email digest configured.
        </p>
    </div>
</body>
</html>
