{% extends "base.html" %}
{% block content %}
<h1>Rules</h1>
<table>
<thead><tr><th colspan="6">Priority &middot; Account &middot; Source &middot; Match &middot; Value &middot; Category</th><th></th></tr></thead>
<tbody>
{% for rule in rules %}
<tr>
    <td colspan="6">
        <form method="post" action="/rules/{{ rule.id }}"
              style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
            <input name="priority" type="number" value="{{ rule.priority }}" size="3" style="width:4em">
            <select name="account_id">
                <option value="">Any account</option>
                {% for account in accounts %}
                <option value="{{ account.id }}" {% if account.id == rule.account_id %}selected{% endif %}>
                    {{ account.name }}
                </option>
                {% endfor %}
            </select>
            <select name="source">
                <option value="payee" {% if rule.source == "payee" %}selected{% endif %}>Payee</option>
                <option value="description" {% if rule.source == "description" %}selected{% endif %}>Description</option>
                <option value="memo" {% if rule.source == "memo" %}selected{% endif %}>Memo</option>
            </select>
            <select name="match_type">
                <option value="contains" {% if rule.match_type == "contains" %}selected{% endif %}>Contains</option>
                <option value="equals" {% if rule.match_type == "equals" %}selected{% endif %}>Equals</option>
                <option value="regex" {% if rule.match_type == "regex" %}selected{% endif %}>Regex</option>
            </select>
            <input name="match_value" value="{{ rule.match_value }}" required>
            <select name="category_id">
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == rule.category_id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
            <button type="submit">Update</button>
        </form>
    </td>
    <td>
        <form method="post" action="/rules/{{ rule.id }}/delete" style="display:inline"
              onsubmit="return confirm('Delete this rule? Transactions previously matched by it keep their category; only the rule itself is removed.');">
            <button type="submit">Delete</button>
        </form>
    </td>
</tr>
{% endfor %}
</tbody>
</table>

<h2>New rule</h2>
<form method="post" action="/rules">
    <select name="account_id">
        <option value="">Any account</option>
        {% for account in accounts %}
        <option value="{{ account.id }}">{{ account.name }}</option>
        {% endfor %}
    </select>
    <select name="source">
        <option value="payee">Payee</option>
        <option value="description">Description</option>
        <option value="memo">Memo</option>
    </select>
    <select name="match_type">
        <option value="contains">Contains</option>
        <option value="equals">Equals</option>
        <option value="regex">Regex</option>
    </select>
    <input name="match_value" placeholder="e.g. KROGER" required>
    <select name="category_id">
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
    </select>
    <input name="priority" type="number" value="0">
    <button type="submit">Add rule</button>
</form>
{% endblock %}
