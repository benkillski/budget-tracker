<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        /* Progress bars (Pico doesn't ship these) */
        .bar {
            background: var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            overflow: hidden;
            height: 0.6rem;
            margin: 0.25rem 0;
        }
        .bar-fill { height: 100%; transition: width 0.2s ease; }
        .bar-fill.ok { background: #22c55e; }
        .bar-fill.warn { background: #f59e0b; }
        .bar-fill.over { background: #ef4444; }
        /* Fixed-category states */
        .bar-fill.pending { background: #94a3b8; }   /* slate — bill not yet posted */
        .bar-fill.paid    { background: #22c55e; }   /* same green as "ok" — expected and done */
        .bar-fill.surprise { background: #ef4444; }  /* same red — unexpected overage */
        .state-tag { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 0.25rem; margin-left: 0.4rem; vertical-align: middle; }
        .state-tag.pending  { background: #475569; color: #e2e8f0; }
        .state-tag.paid     { background: #16a34a; color: #ecfdf5; }
        .state-tag.surprise { background: #dc2626; color: #fef2f2; }
        .state-tag.tracked  { background: #1e40af; color: #dbeafe; }

        /* Row-level inline forms (per-category edit, per-rule edit, filter bar).
           Overrides Pico's default full-width form controls so they sit on one row. */
        .inline-form {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin: 0;
        }
        .inline-form input,
        .inline-form select,
        .inline-form button {
            margin: 0;
        }
        .inline-form input:not([type="checkbox"]):not([type="radio"]),
        .inline-form select,
        .inline-form button { width: auto; }
        .inline-form input[type="number"] { max-width: 5rem; }
        .inline-form input[type="text"],
        .inline-form input:not([type]) { max-width: 14rem; }
        .inline-form input[type="checkbox"] { width: 1.1rem; height: 1.1rem; vertical-align: middle; }
        .inline-form button { padding: 0.35rem 0.75rem; font-size: 0.875rem; }
        .inline-form label { display: inline-flex; align-items: center; gap: 0.35rem; margin: 0; }

        /* Flash banners */
        .flash { padding: 0.75rem 1rem; border-radius: var(--pico-border-radius); margin: 1rem 0; }
        .flash.ok { background: #dcfce7; color: #166534; }
        .flash.warn { background: #fef3c7; color: #854d0e; }
        .flash.error { background: #fee2e2; color: #991b1b; }
        @media (prefers-color-scheme: dark) {
            .flash.ok { background: #14532d; color: #bbf7d0; }
            .flash.warn { background: #713f12; color: #fde68a; }
            .flash.error { background: #7f1d1d; color: #fecaca; }
        }

        /* Transactions table — keep rows compact */
        table.compact th, table.compact td { padding: 0.4rem 0.6rem; }
        table.compact small { color: var(--pico-muted-color); }
        /* Hide marked columns on narrow screens to avoid horizontal scroll. */
        @media (max-width: 720px) {
            .hide-mobile { display: none; }
        }

        /* Rules edit form — grid layout wraps more predictably than flex. */
        .rule-form,
        .rule-form-header {
            display: grid;
            grid-template-columns: 4rem minmax(0, 1fr) 7rem 8rem minmax(0, 1.5fr) minmax(0, 1.3fr) auto;
            gap: 0.5rem;
            align-items: center;
            margin: 0;
        }
        .rule-form-header {
            font-size: 0.75rem;
            color: var(--pico-muted-color);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.25rem 0;
            border-bottom: 1px solid var(--pico-muted-border-color);
        }
        .rule-form-header span { padding: 0 0.4rem; }
        @media (max-width: 900px) {
            .rule-form-header { display: none; }
        }
        .rule-form input, .rule-form select, .rule-form button { width: 100%; margin: 0; }
        .rule-form input[type="number"] { max-width: none; }
        .rule-form button { padding: 0.35rem 0.75rem; font-size: 0.875rem; width: auto; }
        @media (max-width: 900px) {
            .rule-form { grid-template-columns: 4rem repeat(3, minmax(0, 1fr)); }
            .rule-form input[name="match_value"],
            .rule-form select[name="category_id"] { grid-column: 1 / -1; }
            .rule-form button { grid-column: 1 / -1; justify-self: end; }
        }

        /* Nested budgets on dashboard */
        .budget-group { margin-bottom: 1rem; }
        .budget-group .child { margin-left: 1.5rem; margin-top: 0.4rem; }

        /* Dashboard grids — 2 columns on wide screens, 1 on mobile */
        .budget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            align-items: start;  /* cards hug their content instead of stretching to row height */
        }
        .budget-grid article {
            margin: 0;
            padding: 1rem 1.2rem;
        }
        .budget-grid article .child { margin-left: 1rem; margin-top: 0.4rem; }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.5rem 1rem;
        }
        .accounts-grid .account-tile {
            padding: 0.4rem 0.6rem;
            border-left: 2px solid var(--pico-muted-border-color);
        }
        .accounts-grid .account-tile.negative { border-left-color: #ef4444; }

        /* Make tables scroll horizontally on narrow screens instead of overflowing. */
        .table-wrap { overflow-x: auto; }

        /* Keep inline <small> descriptions legible */
        small.muted { color: var(--pico-muted-color); }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Budget Tracker</strong></li>
        </ul>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/transactions">Transactions</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/trends">Trends</a></li>
            <li><a href="/settings">Settings</a></li>
            <li><a href="/import">Import</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
